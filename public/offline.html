<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Mindcraft</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F2EA; color: #30261F;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; padding: 1rem; }
      main { max-width: 30rem; background: #FFFCF7; border: 1px solid #D9CEC1; border-radius: 14px; padding: 1.5rem; }
      h1 { font-size: 1.375rem; margin: 0 0 0.5rem; }
      p { color: #66574B; margin: 0 0 1rem; }
      button { min-height: 2.75rem; padding: 0.5rem 1rem; border-radius: 10px; border: 0; background: #8F432F; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #1F4E8C; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Mindcraft needs a connection to load and save your workspace. Text you were typing in planning or chat is kept on this device and will be there when you return.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
